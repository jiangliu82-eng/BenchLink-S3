if {![info exists WDA_HOST]} { error "Set WDA_HOST to the WDA module address" }
if {![info exists TARGET_CFG]} { error "Set TARGET_CFG, for example target/stm32f4x.cfg" }
adapter driver cmsis-dap
cmsis-dap backend tcp
cmsis-dap tcp host $WDA_HOST
cmsis-dap tcp port 4441
transport select swd
adapter speed 500
source [find $TARGET_CFG]
